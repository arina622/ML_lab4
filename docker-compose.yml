services:
  api:
    image: iris-api:v2
    ports:
      - "8000:8000"
    restart: on-failure

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
